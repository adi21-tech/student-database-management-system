<!DOCTYPE html>
<html>
<head>
    <title>GTTC Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #203a43;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1a3040;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 50px 40px;
            width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .gttc-logo { width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px; }
        .logo { font-size: 13px; letter-spacing: 3px; color: #00d894; text-transform: uppercase; margin-bottom: 6px; }
        h1 { font-size: 22px; color: #ffffff; margin-bottom: 4px; font-weight: 700; }
        .subtitle { font-size: 13px; color: #a0b4c0; margin-bottom: 36px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #a0b4c0; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .input-group input {
            width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #ffffff; font-size: 14px; outline: none;
        }
        .input-group input::placeholder { color: #5a7080; }
        .error {
            background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3);
            color: #ff8080; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
        }
        button {
            width: 100%; padding: 13px; background: linear-gradient(90deg, #00d894, #00b8d4);
            color: #0f2027; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
        }
        .footer { margin-top: 28px; font-size: 11px; color: #3a5060; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='gttc_logo.jpg') }}" class="gttc-logo" alt="GTTC Logo">
        <div class="logo">GTTC · AIML</div>
        <h1>GTTC-STUDENT RECORDS</h1>
        <p class="subtitle">Sign in to access the portal</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit">LOGIN</button>
        </form>
        <div class="footer">GTTC &copy; 2025 · Authorized Personnel Only</div>
    </div>
</body>
</html>
